<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a56a5">
<title>LaoRus — ກຳລັງໂຫຼດ</title>
<style>
:root{color-scheme:light dark}body{font:16px system-ui,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#f3f6fa;color:#16243d}.box{max-width:32rem;margin:1.5rem;padding:1.5rem 1.75rem;border-radius:1rem;background:white;box-shadow:0 8px 32px #182b4820}h1{font-size:1.25rem}p{line-height:1.7;color:#52627a}.bar{height:6px;background:#dce4f0;border-radius:9px;overflow:hidden}.bar:after{content:"";display:block;width:40%;height:100%;background:#2a56a5;animation:go 1.2s ease-in-out infinite alternate}@keyframes go{to{transform:translateX(150%)}}@media(prefers-color-scheme:dark){body{background:#101827;color:#edf3ff}.box{background:#1a2638}p{color:#c3cee0}.bar{background:#34445f}}
</style>
</head>
<body>
<main class="box" role="status" aria-live="polite">
<h1>LaoRus</h1>
<p id="status">ກຳລັງໂຫຼດຂໍ້ມູນຄົບຊຸດ…</p>
<div class="bar" aria-hidden="true"></div>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if(!('DecompressionStream' in window)) throw new Error('ບຣາວເຊີນີ້ບໍ່ຮອງຮັບ gzip decompression; ກະລຸນາລອງໃຊ້ Chrome, Safari ຫຼື Firefox ລຸ້ນໃໝ່.');
  status.textContent='ກຳລັງດາວໂຫຼດຂໍ້ມູນ…';
  const response=await fetch('./laorus.html.gz');
  if(!response.ok) throw new Error('ດາວໂຫຼດບໍ່ສຳເລັດ ('+response.status+'). ກວດວ່າ laorus.html.gz ຢູ່ໃນໂຟນເດີດຽວກັນກັບ index.html.');
  status.textContent='ກຳລັງຖອດລະຫັດ…';
  const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open('text/html','replace');
  document.write(html);
  document.close();
 }catch(e){
  status.textContent='ໂຫຼດບໍ່ສຳເລັດ: '+(e&&e.message?e.message:String(e));
  const help=document.createElement('p');
  help.textContent='ໃຫ້ອັບໂຫຼດ index.html ແລະ laorus.html.gz ໄວ້ຮາກຂອງ repository ດຽວກັນ ແລະເປີດຜ່ານ GitHub Pages (ບໍ່ແມ່ນເປີດ index.html ຈາກເຄື່ອງໂດຍກົງ).';
  document.querySelector('main').appendChild(help);
 }
})();
</script>
</body>
</html>
